[package]
name = "lexpad-desktop"
version = "0.1.0"
description = "Lexpad for macOS and Windows: add a word from any app"
authors = ["Lexpad"]
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "lexpad_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned to the minor version: tray.rs reaches the inner tray-icon crate
# (with_inner_tray_icon), which Tauri may update in a minor release.
# macos-private-api: the panel window is transparent so it can have rounded
# corners (the app is not for the Mac App Store; see README).
tauri = { version = "~2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
ico = "0.5"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# native-tls: the operating system's own TLS (Security.framework, SChannel),
# so no TLS library of ours ships in the app.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "macros", "rt-multi-thread"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
subtle = "2"
url = "2"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSData", "NSObject"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace", "NSResponder", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Storage_FileSystem",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
