# The gate on every push and pull request, on Linux; the Windows release
# build on a version tag. macOS is built on the owner's Mac
# (scripts/release-mac.sh), not here.
#
# Why it is shaped this way: this repository was private until 9 October
# 2026 (public repositories run standard runners free), and Actions billed a
# macOS minute as ten and a Windows minute as two. Building both on every
# push to main was 1,300 billed minutes in two days, and the same allowance
# runs the API's deploys. So:
# - check (Linux, every push and pull request): what `pnpm check` runs
#   (prettier, tsc, vitest, vite build, rustfmt, clippy -D warnings and the
#   Rust tests), on Linux, where the core builds with its no-op capture and
#   notifications (so dead code is allowed there alone), then clippy again
#   for the Windows target, which compiles every
#   Windows-only module (UI Automation, toasts, the tray icon) without a
#   Windows machine. The macOS-only modules are compiled by the pre-commit
#   hook on the Mac this is developed on, and by every release build there.
# - release (Windows, on a `v*` tag or by hand): clippy and the Rust tests on
#   Windows itself, the unsigned NSIS .exe and .msi as artifacts, then the
#   installer is run silently, the installed app started and required to be
#   running 20 seconds later, and the placement smoke test: a build with the
#   `smoke-test` feature (never shipped; src-tauri/src/smoke.rs) opens the
#   popup at points all over every monitor and the panel from an icon, and
#   fails unless every window ends inside its monitor's work area.
# - a push that changes only docs/ or Markdown runs nothing; a newer push to
#   the same branch cancels the older run. Tag pushes always run.
# - Rust (Swatinem/rust-cache) and pnpm downloads are cached in every job.
#
# The release flow is in README, "Release".
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the code and upload artifacts; the token never needs to
# write. (The repository's default is read-only too.)
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-check
          cache-on-failure: true
      # What Tauri needs to build on Linux (webkit2gtk, the tray, the menus),
      # and llvm-rc with clang, which the Windows-target clippy uses to
      # compile the app's Windows resources (icon, manifest).
      - name: Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev llvm clang
      - run: pnpm install --frozen-lockfile
      # `pnpm check`, step by step, with one difference: on Linux the capture
      # and notification modules are stubs, so helpers only macOS and Windows
      # call are dead here, and dead_code is allowed on this host alone. Every
      # other lint is denied; the Windows clippy below and the Mac's
      # pre-commit hook still deny dead code on the real platforms.
      - run: pnpm format:check && pnpm typecheck && pnpm test && pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings -A dead_code
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: clippy for Windows (every cfg(windows) module)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --target x86_64-pc-windows-msvc -- -D warnings

  release-windows:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-release
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # TODO(signing, Windows): sign the .exe and .msi with an Authenticode
      # certificate or Azure Trusted Signing (bundle.windows.signCommand).
      # TODO(signing, macOS) is in scripts/release-mac.sh, which builds macOS.

      - run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: lexpad-desktop-Windows
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Install and start
        timeout-minutes: 5
        shell: pwsh
        run: |
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Lexpad" -Filter *.exe -Recurse |
            Where-Object { $_.Name -notlike 'uninstall*' } | Select-Object -First 1
          if (-not $exe) { Get-ChildItem "$env:LOCALAPPDATA\Lexpad" -Recurse; throw 'Lexpad was not installed' }
          Write-Host "Installed at $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "Lexpad exited early with code $($p.ExitCode)" }
          Write-Host "Lexpad is running (pid $($p.Id))"
          Stop-Process -Id $p.Id -Force

      - name: Placement smoke test
        timeout-minutes: 30
        shell: pwsh
        run: |
          pnpm tauri build --no-bundle --features smoke-test
          $p = Start-Process -FilePath 'src-tauri/target/release/lexpad-desktop.exe' -ArgumentList '--smoke-test' -RedirectStandardOutput smoke.txt -RedirectStandardError smoke-err.txt -Wait -PassThru
          Get-Content smoke.txt
          Write-Host "exit code $($p.ExitCode)"
          if (-not (Select-String -Path smoke.txt -Pattern '^SMOKE failures 0' -Quiet)) { Get-Content smoke-err.txt; exit 1 }
          exit $p.ExitCode
