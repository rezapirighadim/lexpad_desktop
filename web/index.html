    <script>
      // Apply the stored theme and palette before the first paint so the app
      // never flashes the wrong colours. Data lives in IndexedDB; these two
      // tiny preferences are the only thing localStorage is used for.
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem('wb.theme') || 'system';
          var palette = localStorage.getItem('wb.palette') || 'forest';
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.dataset.theme = dark ? 'dark' : 'light';
          root.dataset.palette = palette;
        } catch (_) {
          /* private mode: fall back to the stylesheet defaults */
        }
      })();
    </script>
